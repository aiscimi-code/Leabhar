name: Deferred issues

# Coverage-matrix rows deferred to a closed issue are lost work (issue #289).
# Weekly, not on pull requests: AGENTS.md runs no CI on PRs by decision.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-deferred-issues.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
