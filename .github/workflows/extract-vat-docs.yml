name: Extract VAT docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 pdfplumber
      - run: python3 docs/statutes/scripts/extract_vat_sources.py
      - name: Commit extracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/statutes
          if git diff --cached --quiet; then
            echo "No new files"
            exit 0
          fi
          git checkout -b "docs/vat-extract-$(date +%Y%m%d-%H%M%S)"
          git commit -m "Add full VATCA revised sections, S.I. 639/2010, and TDM 38-01-03b extracts."
          git push origin HEAD
