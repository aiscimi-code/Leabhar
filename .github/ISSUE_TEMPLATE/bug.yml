name: Bug report
description: Report something that is broken or wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        If this is a security vulnerability, do **not** open an issue —
        email aiscimi@gmail.com (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem and its impact.
      placeholder: "When I ... I expected ... but instead ..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Leabhar version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Node version and OS.
      placeholder: "Node 22.x, Windows 11"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Extraction provider
      options:
        - local (default)
        - anthropic
        - not sure
    validations:
      required: true
